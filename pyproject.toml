[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]

[tool.setuptools]
packages = ["oligo_designer_toolsuite_ai_filters"]

[tool.setuptools.dynamic]
#version = {attr = "my_package.VERSION"}
readme = { file = "README.md" }

[tool.setuptools_scm]
write_to = "oligo_designer_toolsuite_ai_filters/_version.py"

[project]
name = "oligo-designer-toolsuite-ai-filters"
version = "0.0.3"
authors = [
  { name = "Francesco Campi", email = "francesco.campi@helmholtz-munich.de" },
  { name = "Lisa Barros de Andrade e Sousa", email = "lisa.barros.andrade.sousa@gmail.com" },
]
maintainers = [
  { name = "Francesco Campi", email = "francesco.campi@helmholtz-munich.de" },
]
description = "AI plug-ins for the Oligo Designer Toolsuite package"
keywords = [
  "bioinformatics",
  "probes",
  "oligo nucleotides",
  "probe design",
  "oligo design",
]
readme = "README.md"
#requires-python = "<3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
    "torch",
    "seaborn",
    "pandas",
    "biopython",
]



[project.urls]
repository = "https://github.com/HelmholtzAI-Consultants-Munich/oligo-designer-toolsuite-AI-filters"

[tool.black]
line-length = 110
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 110

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true

# Ignore missing imports for third-party packages
[[tool.mypy.overrides]]
module = [
  "biopython.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hybridization_probability"
ignore_errors = true
